<title>Brenda Martinez — Employability Strategist</title>

<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.bgglow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(600px 500px at 80% 8%,rgba(37,99,235,.35),transparent 60%),radial-gradient(500px 500px at 15% 95%,rgba(14,165,233,.18),transparent 60%)}
.card{position:relative;z-index:1;width:100%;max-width:470px;min-height:100vh;background:#000;overflow:hidden}
.halftone{position:absolute;inset:0;z-index:2;background-image:radial-gradient(circle,rgba(59,130,246,.75) 1.3px,transparent 1.8px);background-size:13px 13px;opacity:.3;-webkit-mask-image:radial-gradient(130% 55% at 82% 12%,#000,transparent 58%);mask-image:radial-gradient(130% 55% at 82% 12%,#000,transparent 58%)}
.photo{position:relative;z-index:3;width:100%;aspect-ratio:1/1.08;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 8%}
.photo:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 52%,#000 98%)}
.content{position:relative;z-index:4;margin-top:-70px;padding:0 30px 46px;text-align:center}
.kick{font-family:'Space Mono',monospace;color:#3b82f6;letter-spacing:4px;font-size:12px;text-transform:uppercase;margin-bottom:8px}
.name{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:58px;line-height:.86;letter-spacing:.5px;margin-bottom:6px}
.name .w{color:#fff}.name .g{color:#7c8496}
.tag{font-family:'Space Mono',monospace;color:#4b90ff;letter-spacing:1px;font-size:12.5px;margin-bottom:28px}
.tag b{color:#fff;font-weight:400}
.pills{display:flex;flex-direction:column;gap:13px;margin-bottom:22px}
.pill{background:#fff;color:#0a0a0d;border-radius:40px;padding:16px 26px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:11px;text-decoration:none;transition:transform .18s,box-shadow .18s,background .18s;opacity:0;transform:translateY(14px);animation:up .5s forwards}
.pill:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(37,99,235,.5);background:#eef4ff}
.pill .b{color:#2563eb;font-family:'Space Mono',monospace;font-size:14px;font-weight:700}
.pill:nth-child(1){animation-delay:.05s}.pill:nth-child(2){animation-delay:.13s}.pill:nth-child(3){animation-delay:.21s}.pill:nth-child(4){animation-delay:.29s}
@keyframes up{to{opacity:1;transform:none}}
.loc{font-family:'Space Mono',monospace;color:#8b96b4;letter-spacing:3px;font-size:12px}
.frame{position:absolute;inset:14px;border:1px solid rgba(90,130,220,.22);z-index:5;pointer-events:none;border-radius:6px}
.br{position:absolute;width:34px;height:34px;border-color:#3b82f6;z-index:6;pointer-events:none}
.tl{top:12px;left:12px;border-top:2px solid;border-left:2px solid}
.brr{bottom:12px;right:12px;border-bottom:2px solid;border-right:2px solid}
</style></head><body>
