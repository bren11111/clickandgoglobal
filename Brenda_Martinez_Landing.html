  :root{
    --red:#E0322B; --red2:#ff4338; --bg:#0c0c0d; --panel:#161617; --panel2:#1c1c1e;
    --line:#2a2a2c; --ink:#f4f4f4; --mut:#9a9a9d; --mut2:#6f6f72;
    --big:'BigSh',sans-serif; --body:'Inst',sans-serif; --mono:'Geist',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);}
  a{color:inherit;text-decoration:none;}

  /* language toggle */
  .langtog{position:fixed;top:18px;right:20px;z-index:50;display:flex;
    background:rgba(20,20,22,.85);backdrop-filter:blur(6px);border:1px solid var(--line);
    border-radius:30px;overflow:hidden;font-family:var(--mono);font-size:12px;letter-spacing:1px;}
  .langtog button{background:none;border:none;color:var(--mut);padding:8px 16px;cursor:pointer;
    font-family:var(--mono);letter-spacing:1px;transition:.2s;}
  .langtog button.on{background:var(--red);color:#fff;font-weight:600;}

  .page{max-width:1080px;margin:0 auto;position:relative;overflow:hidden;
    background:radial-gradient(900px 500px at 78% 4%, rgba(224,50,43,.18), transparent 60%), var(--bg);
    padding:54px 60px 48px;}

  .top{display:flex;justify-content:space-between;align-items:center;gap:20px;
    font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--mut);
    text-transform:uppercase;padding-right:120px;}
  .top .red{color:var(--red);font-weight:600;}

  .hero{position:relative;margin-top:14px;min-height:560px;}
  .bigname{position:absolute;top:14px;left:0;width:660px;font-family:var(--big);font-weight:700;
    color:var(--red);font-size:112px;line-height:.86;letter-spacing:1px;z-index:1;text-transform:uppercase;}
  .heroimg{position:absolute;top:0;right:20px;height:560px;z-index:2;border-radius:4px;overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom,#000 86%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 86%,transparent 100%);}
  .heroimg img{height:560px;display:block;filter:contrast(1.04) saturate(1.05);}
  .intro{position:absolute;left:0;bottom:0;width:430px;z-index:3;}
  .hi{font-family:var(--mono);color:var(--red);letter-spacing:4px;font-size:13px;text-transform:uppercase;margin-bottom:10px;}
  .role{font-family:var(--big);font-weight:700;color:#fff;font-size:44px;line-height:.98;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  .rolekw{font-family:var(--mono);color:var(--red);font-size:11.5px;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;line-height:1.5;max-width:420px;}
  .blurb{color:var(--mut);font-size:14.5px;line-height:1.55;max-width:410px;}
  .facts{position:absolute;right:0;bottom:8px;width:250px;z-index:3;}
  .fact{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:9px 2px;font-size:12.5px;letter-spacing:.5px;}
  .fact span{color:var(--mut2);text-transform:uppercase;font-family:var(--mono);font-size:11px;}
  .fact b{color:#fff;font-weight:600;text-transform:uppercase;text-align:right;}

  .sec{display:flex;align-items:center;gap:16px;margin:44px 0 18px;}
  .sec h2{font-family:var(--mono);letter-spacing:7px;font-size:13px;color:var(--red);text-transform:uppercase;white-space:nowrap;font-weight:600;}
  .sec .rule{height:1px;background:var(--line);flex:1;}

  .cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:10px;padding:18px 18px 20px;position:relative;transition:.25s;}
  .card:hover{border-color:rgba(224,50,43,.55);transform:translateY(-4px);box-shadow:0 14px 40px rgba(0,0,0,.5);}
  .card .no{font-family:var(--big);font-weight:700;color:var(--red);font-size:19px;background:rgba(224,50,43,.12);border:1px solid rgba(224,50,43,.4);width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:7px;}
  .card h3{font-family:var(--big);font-weight:700;font-size:21px;color:#fff;margin:14px 0 3px;text-transform:uppercase;letter-spacing:.5px;line-height:1.05;}
  .card .meta{font-family:var(--mono);font-size:10.5px;color:var(--red);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}
  .card p{color:var(--mut);font-size:13px;line-height:1.5;}
  .card .yr{position:absolute;top:18px;right:18px;font-family:var(--mono);font-size:11px;color:var(--mut2);}

  .lower{display:grid;grid-template-columns:1.05fr 1.15fr 1.25fr;gap:34px;margin-top:8px;}
  .colh{font-family:var(--mono);letter-spacing:6px;font-size:12px;color:var(--red);text-transform:uppercase;margin-bottom:18px;font-weight:600;}
  .step{display:flex;gap:13px;margin-bottom:15px;}
  .step .n{font-family:var(--big);font-weight:700;color:var(--red);font-size:22px;line-height:1;min-width:30px;}
  .step h4{font-size:13.5px;color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
  .step p{font-size:12px;color:var(--mut);line-height:1.45;}
  .skills{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-size:12px;color:#e7e7e7;display:flex;align-items:center;gap:8px;transition:.2s;}
  .chip:hover{border-color:rgba(224,50,43,.5);background:#1e1516;}
  .chip i{width:6px;height:6px;background:var(--red);border-radius:50%;display:inline-block;flex:none;}
  .award{margin-top:14px;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:9px;padding:14px 16px;display:flex;gap:12px;align-items:center;}
  .award .ic{font-size:18px;color:var(--red);}
  .award .t{font-family:var(--mono);font-size:10px;color:var(--red);letter-spacing:2px;text-transform:uppercase;}
  .award b{font-size:13px;color:#fff;}
  .award small{color:var(--mut);font-size:11.5px;}

  .ctitle{font-family:var(--big);font-weight:700;font-size:34px;color:#fff;line-height:.98;text-transform:uppercase;margin-bottom:12px;}
  .ctitle span{color:var(--red);}
  .csub{color:var(--mut);font-size:13px;line-height:1.5;margin-bottom:16px;}
  .crow{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:10px;transition:.2s;}
  .crow:hover{border-color:rgba(224,50,43,.5);}
  .crow .ic{width:30px;height:30px;border-radius:7px;background:rgba(224,50,43,.12);border:1px solid rgba(224,50,43,.4);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;}
  .crow .lab{font-family:var(--mono);font-size:9.5px;color:var(--mut2);letter-spacing:1.5px;text-transform:uppercase;}
  .crow .val{font-size:13px;color:#fff;word-break:break-all;}
  .cta{margin-top:4px;width:100%;background:var(--red);border:none;border-radius:9px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--big);font-weight:700;text-transform:uppercase;color:#fff;font-size:16px;letter-spacing:1px;cursor:pointer;transition:.2s;}
  .cta:hover{background:var(--red2);transform:translateY(-2px);box-shadow:0 10px 30px rgba(224,50,43,.35);}

  .foot{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:36px;border-top:1px solid var(--line);padding-top:20px;flex-wrap:wrap;}
  .quote{font-style:italic;color:#cfcfcf;font-size:15px;max-width:560px;line-height:1.4;}
  .quote .q{color:var(--red);font-family:var(--big);font-weight:700;font-size:22px;}
  .langs{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:1px;text-align:right;text-transform:uppercase;}
  .langs b{color:#fff;}

  /* scroll reveal */
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease, transform .6s ease;}
  .reveal.in{opacity:1;transform:none;}

  /* ---------- responsive ---------- */
  @media(max-width:860px){
    .page{padding:70px 22px 40px;}
    .top{flex-direction:column;align-items:flex-start;gap:8px;padding-right:0;font-size:10.5px;letter-spacing:2px;}
    .hero{min-height:0;display:flex;flex-direction:column;}
    .bigname{position:static;width:auto;font-size:58px;order:1;margin-bottom:16px;}
    .heroimg{position:static;height:auto;order:2;margin-bottom:22px;-webkit-mask-image:none;mask-image:none;border-radius:10px;}
    .heroimg img{height:auto;width:100%;}
    .intro{position:static;width:auto;order:3;margin-bottom:22px;}
    .role{font-size:34px;}
    .blurb{max-width:none;}
    .facts{position:static;width:100%;order:4;}
    .cards{grid-template-columns:1fr;}
    .lower{grid-template-columns:1fr;gap:26px;}
    .foot{flex-direction:column;align-items:flex-start;}
    .langs{text-align:left;}
    .ctitle{font-size:30px;}
  }
</style>
</head>

  var LANG = 'en';
  function decodeEntities(s){ var t=document.createElement('textarea'); t.innerHTML=s; return t.value; }
  function setLang(l){
    LANG=l;
    document.documentElement.lang=l;
    document.getElementById('btn-es').classList.toggle('on', l==='es');
    document.getElementById('btn-en').classList.toggle('on', l==='en');
    document.querySelectorAll('[data-'+l+']').forEach(function(el){
      el.innerHTML = decodeEntities(el.getAttribute('data-'+l));
    });
  }
  function downloadCV(){
    var a=document.createElement('a');
    a.href=PDF[LANG];
    a.download = LANG==='es' ? 'Brenda_Martinez_CV_ES.pdf' : 'Brenda_Martinez_CV_EN.pdf';
    document.body.appendChild(a); a.click(); a.remove();
  }

  setLang('en');
  // scroll reveal
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
  },{threshold:.12});
  document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});
  window.__revealAll=function(){document.querySelectorAll('.reveal').forEach(function(el){el.classList.add('in');});};
